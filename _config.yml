title: Anne Schuth
email: anne.schuth@gmail.com
description: >- #
  Anne Schuth has a PhD in Search and works on AI and Engineering for the Dutch Government
domain: anneschuth.github.io
url: https://anneschuth.nl
# In JEKYLL_ENV=production (the deploy), jekyll-github-metadata (pulled in by
# the github-pages gem) overrides baseurl when it is unset or "/", and without
# GitHub API access it guesses wrong (/pages/anneschuth/). An explicit "" plus
# the repository name keeps the build deterministic and offline.
baseurl: ""
repository: anneschuth/anneschuth.github.io
github_username: anneschuth
linkedin_username: anneschuth
bluesky_username: anneschuth.nl
mastodon:
- username: anneschuth
  instance: mastodon.social

theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-spaceship

# Custom navigation links
header_pages:
  - about.markdown
  - cv.markdown
  - publications.markdown
  - talks.markdown
  - activities.markdown
  - software.markdown
  - teaching.markdown
  - thesis.markdown
  - press.markdown

paginate: 10

future: true

minima:
  date_format: "%b %-d, %Y"
  social_links:
    github: anneschuth
    linkedin: anneschuth

collections:
  publications:
    output: true
    permalink: /:collection/:name
  talks:
    output: true
    permalink: /:collection/:name
  press:
    output: true
    permalink: /:collection/:name
  students:
    output: true
    permalink: /:collection/:name
  software:
    output: false
  reisblog_fietsen:
    output: true
    permalink: /reisblog/fietsen/:name/
  reisblog_india:
    output: true
    permalink: /reisblog/india/:name/

# Let op: dit overschrijft Jekylls standaard-excludes, dus die staan er hier
# expliciet bij (anders leest de build gem-bestanden onder vendor/ mee).
exclude:
  - reisblog-raw
  - scripts
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
