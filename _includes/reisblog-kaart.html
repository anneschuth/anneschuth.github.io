<link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css" />
<div id="reisblog-map"></div>
<script src="/assets/vendor/leaflet/leaflet.js"></script>
<script>
  (function () {
    {% assign posts = include.posts | where_exp: "p", "p.lat" | sort: "date" %}
    var posts = [
      {%- for p in posts %}
      { lat: {{ p.lat }}, lng: {{ p.lng }}, title: {{ p.title | jsonify }}, url: {{ p.url | relative_url | jsonify }}, date: {{ p.date_display | jsonify }}, slug: {{ p.url | split: "/" | last | jsonify }} }{% unless forloop.last %},{% endunless %}
      {%- endfor %}
    ];

    if (!posts.length) { return; }
    var map = L.map('reisblog-map', { scrollWheelZoom: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bijdragers'
    }).addTo(map);

    var accent = getComputedStyle(document.documentElement)
      .getPropertyValue('--accent-color').trim() || '#c2410c';

    L.polyline(posts.map(function (p) { return [p.lat, p.lng]; }),
      { color: accent, weight: 2, opacity: 0.5, dashArray: '6 6' }).addTo(map);

    var markers = {};
    posts.forEach(function (p, i) {
      markers[p.slug] = L.circleMarker([p.lat, p.lng], {
        radius: 6, color: accent, weight: 2, fillColor: accent, fillOpacity: 0.5
      }).addTo(map).bindPopup(
        '<strong><a href="' + p.url + '">' + p.title + '</a></strong><br />' +
        (i + 1) + '/' + posts.length + ' &middot; ' + p.date
      );
    });

    // Doorklik vanaf een post: #<slug> zoomt in op dat punt
    var hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (hash && markers[hash]) {
      map.setView(markers[hash].getLatLng(), 7);
      markers[hash].openPopup();
    } else {
      map.fitBounds(posts.map(function (p) { return [p.lat, p.lng]; }), { padding: [30, 30] });
    }
  })();
</script>
