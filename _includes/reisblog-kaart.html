<link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css" />
<div id="reisblog-map"></div>
<script src="/assets/vendor/leaflet/leaflet.js"></script>
<script>
  (function () {
    {% assign posts = include.posts | where_exp: "p", "p.lat" | sort: "date" %}
    // Punten in reisvolgorde: per verslag eerst de tussenstops uit de tekst,
    // dan de schrijflocatie (het klikbare hoofdpunt).
    var points = [
      {%- for p in posts %}
      {%- for w in p.route %}
      { lat: {{ w.lat }}, lng: {{ w.lng }}, name: {{ w.name | jsonify }}, main: false },
      {%- endfor %}
      { lat: {{ p.lat }}, lng: {{ p.lng }}, title: {{ p.title | jsonify }}, url: {{ p.url | relative_url | jsonify }}, date: {{ p.date_display | jsonify }}, slug: {{ p.url | split: "/" | last | jsonify }}, main: true }{% unless forloop.last %},{% endunless %}
      {%- endfor %}
    ];

    var mains = points.filter(function (p) { return p.main; });
    if (!mains.length) { return; }
    var map = L.map('reisblog-map', { scrollWheelZoom: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bijdragers &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);

    var accent = getComputedStyle(document.documentElement)
      .getPropertyValue('--accent-color').trim() || '#c2410c';

    L.polyline(points.map(function (p) { return [p.lat, p.lng]; }),
      { color: accent, weight: 2, opacity: 0.5, dashArray: '6 6' }).addTo(map);

    points.forEach(function (p) {
      if (p.main) { return; }
      L.circleMarker([p.lat, p.lng], {
        radius: 3, color: accent, weight: 1, opacity: 0.6, fillColor: accent, fillOpacity: 0.4
      }).addTo(map).bindTooltip(p.name);
    });

    var markers = {};
    mains.forEach(function (p, i) {
      markers[p.slug] = L.circleMarker([p.lat, p.lng], {
        radius: 6, color: accent, weight: 2, fillColor: accent, fillOpacity: 0.5
      }).addTo(map).bindPopup(
        '<strong><a href="' + p.url + '">' + p.title + '</a></strong><br />' +
        (i + 1) + '/' + mains.length + ' &middot; ' + p.date
      );
    });

    // Doorklik vanaf een post: #<slug> zoomt in op dat punt
    var hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (hash && markers[hash]) {
      map.setView(markers[hash].getLatLng(), 7);
      markers[hash].openPopup();
    } else {
      map.fitBounds(points.map(function (p) { return [p.lat, p.lng]; }), { padding: [30, 30] });
    }
  })();
</script>
