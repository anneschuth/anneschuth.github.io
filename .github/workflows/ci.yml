name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "quality" is the required status check in the branch protection of main.
  # Keep the job id as is; renaming it blocks every merge.
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # The CV PDF is rendered at deploy time (deploy.yml) and never committed.
      # Rendering it here as well means a PR that breaks the render fails this
      # required check, instead of the deployment after merge. Reuses the
      # _site/ that the jekyll-build pre-commit hook just produced.
      - name: Render CV PDF
        uses: ./.github/actions/render-cv-pdf
        with:
          output-dir: assets

      - name: Upload CV PDF and thumbnail for review
        uses: actions/upload-artifact@v4
        with:
          name: cv-anne-schuth
          path: |
            assets/cv-anne-schuth.pdf
            assets/cv-thumbnail.png
          if-no-files-found: error
          retention-days: 14
